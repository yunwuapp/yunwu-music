name: Build IPA

on:
  workflow_dispatch:

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-15-intel, macos-15, macos-26]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - name: Install XcodeGen
        run: brew install xcodegen || brew upgrade xcodegen

      - name: Show toolchain
        run: xcodebuild -version; sw_vers

      - name: Generate project
        run: xcodegen generate

      - name: Build unsigned
        run: |
          set +e
          xcodebuild -project Beans.xcodeproj -scheme Beans \
            -configuration Release -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" \
            build > build.log 2>&1
          code=$?
          grep -E "error:|BUILD (SUCCEEDED|FAILED)" build.log | tail -40
          exit $code

      - name: Package IPA
        run: |
          mkdir -p Payload
          cp -R build/Build/Products/Release-iphoneos/Beans.app Payload/
          zip -qry YunWu.ipa Payload
          ls -lh YunWu.ipa

      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: YunWu-ipa-${{ matrix.os }}
          path: YunWu.ipa

      - name: Upload build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: buildlog-${{ matrix.os }}
          path: build.log
